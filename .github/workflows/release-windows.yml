# Build and publish Windows installer + portable zip on version tags.
#
# Triggers:
#   - push tag v*  (e.g. v0.1.3)
#   - workflow_dispatch (dev artifacts, no GitHub Release unless tag)
#
# Artifacts:
#   - keys-layer-<ver>-windows-x64-setup.exe  (Inno Setup)
#   - keys-layer-<ver>-windows-x64.zip        (portable)

name: release-windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $v = $env:GITHUB_REF_NAME.TrimStart("v")
          } else {
            $v = "0.0.0-dev.$($env:GITHUB_SHA.Substring(0, 7))"
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "version=$v"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release -p keys-layer

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer + portable zip
        shell: pwsh
        run: |
          .\scripts\build-windows-installer.ps1 -Version "${{ steps.ver.outputs.version }}" -SkipBuild

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: keys-layer-windows-${{ steps.ver.outputs.version }}
          path: |
            dist/windows/*.exe
            dist/windows/*.zip

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/windows/*.exe
            dist/windows/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
