[settings]
# Global fallback when a layer/key does not set hold_ms.
hold_ms = 200
# macOS: allowlist keyboards only (product-name substring). Empty = all keyboard-class
# HID devices — Bluetooth mice often expose a Keyboard interface and seizing them
# freezes the cursor. List names: sudo keys-layer --list-devices
# Linux: same filter; Windows ignores this (system-wide hook).
devices = ["Apple Internal"]
# devices = ["Apple Internal", "Moonlander"]
# Mac-style F1–F12 ↔ media (macOS only; ignored on Linux).
# Only these product-name substrings get it — other boards keep real F-keys.
# F3/F4 stay as F-keys (no Mission Control / Spotlight via VirtualHID).
# Set [] to disable. See configuration.md § F1–F12.
f_row_media_devices = ["Apple Internal"]

# Hold F → mod_f. Hold Caps → mod_caps (vim arrows).
[layer.base]
hold_ms = 150
f = { tap = "f", hold = "mod_f" }
caps = { hold = "mod_caps", native = "disable", hold_ms = 100 }

# While mod_f is active: J → Delete; K → Option+Delete (delete word).
[layer.mod_f]
j = { key = "delete" }
k = ["left_alt", "delete"]

# While mod_caps is active: hjkl → arrows (vim style).
[layer.mod_caps]
h = "left"
j = "down"
k = "up"
l = "right"
