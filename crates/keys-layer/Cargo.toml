[package]
name = "keys-layer"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Hold-to-layer keyboard remapper (macOS / Linux / Windows)"

[[bin]]
name = "keys-layer"
path = "src/main.rs"

[dependencies]
keys-layer-core = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
# 0.3.x matches Karabiner-Elements' bundled VirtualHID daemon (~6.x).
# 0.4.x requires standalone VirtualHIDDevice v8.0.0 (protocol 7) and will
# fail with connect_failed asio.system:2 against KE's daemon.
karabiner-driverkit = "=0.3.0"
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Console",
] }
